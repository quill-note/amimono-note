<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e7c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c2421" media="(prefers-color-scheme: dark)">
<title>あみものノート</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="あみものノート">
<style>
/* ===== writing-studio と同じ作り・翡翠色版 ===== */
:root{
  --primary:#2f9e7c;        /* 翡翠色 */
  --primary-dark:#23866a;
  --primary-light:#8fd0ba;
  --primary-pale:#ebf7f2;
  --bg:#f6fbf9;             /* ほぼ白、ほんのり翡翠 */
  --surface:#ffffff;
  --surface2:#f1f8f5;
  --border:#cfe6dd;
  --text:#1f3a33; --text2:#44695f; --text3:#7fa197;
  --shadow:rgba(47,158,124,.13);
  --done:#9cc7b8; --danger:#e0584f;
}
@media (prefers-color-scheme:dark){:root{
  --primary:#4fbf9a; --primary-dark:#3fa885; --primary-light:#2f7a63; --primary-pale:#1d3a31;
  --bg:#141a18; --surface:#1c2421; --surface2:#222c29; --border:#2e3d38;
  --text:#e3eeea; --text2:#b0c6bf; --text3:#7d948d; --shadow:rgba(0,0,0,.35);
  --done:#4f7d6e; --danger:#ef7b73;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Meiryo","メイリオ","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
svg.ic{width:20px;height:20px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ヘッダー */
.header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--surface);box-shadow:0 2px 8px var(--shadow)}
.header h1{flex:1;min-width:0;font-size:20px;font-weight:700;color:var(--primary);letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header h1 .logo svg.ic{width:24px;height:24px;margin:-3px 6px 0 0;stroke-width:1.8}
.header h1.sub{font-size:17px;color:var(--text)}
.btn-icon{flex:none;width:36px;height:36px;border-radius:50%;border:none;background:var(--primary-pale);color:var(--primary);display:flex;align-items:center;justify-content:center;transition:background .2s}
.btn-icon:active{background:var(--border)}
.hbtn{flex:none;padding:7px 16px;border-radius:20px;font-size:14px;font-weight:600;border:1.5px solid var(--border);background:var(--surface2);color:var(--text2)}
.hbtn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.hbtn.primary:active{background:var(--primary-dark)}
.row-del{flex:none;border:none;background:none;color:var(--text3);width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.row-del:active{background:var(--surface2);color:var(--danger)}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 90px)}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);transition:background .2s}
.btn svg.ic{width:18px;height:18px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:active{background:var(--primary-dark)}
.btn.outline{background:var(--surface);border-color:var(--primary-light);color:var(--primary)}
.btn.danger{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4}
.btn-add{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;padding:12px;border:2px dashed var(--primary-light);border-radius:14px;background:var(--primary-pale);color:var(--primary);font-size:14px;font-weight:700;margin-bottom:12px}
.block{display:flex;width:100%;margin:10px 0}
.actions{display:flex;gap:10px;margin:16px 0}
.actions .btn{flex:1}

/* リスト（白い箱に罫線区切り） */
.list{list-style:none;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;box-shadow:0 2px 6px var(--shadow);overflow:hidden}
.list > li + li{border-top:1px solid var(--border)}

/* 作品リスト */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:13px 8px 13px 14px;cursor:pointer}
.row:active{background:var(--primary-pale)}
.row-photo{width:100%;height:100%;border-radius:50%;object-fit:cover}
.row-icon{flex:none;width:36px;height:36px;border-radius:50%;background:var(--primary-pale);color:var(--primary);display:grid;place-items:center;overflow:hidden}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);margin-top:3px}
.row-meta .bar{flex:1;max-width:120px;margin:0}
.badge svg.ic{width:11px;height:11px;fill:currentColor;margin-right:2px;vertical-align:-1px}
.badge{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--primary-pale);color:var(--primary);font-weight:600;white-space:nowrap}
.row .chev{color:var(--text3)}
.bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;flex:1}
.bar span{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .3s}

/* 工程チェック */
.memo{background:var(--surface);border:1.5px solid var(--border);border-left:4px solid var(--primary);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:13px;color:var(--text2);margin-bottom:14px}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px}
.step{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .15s}
.step .row-no{flex:none;min-width:4.2em;font-size:13px;font-weight:700;color:var(--primary);white-space:nowrap}
.step .text{flex:1;font-size:15px;white-space:pre-wrap;word-break:break-word}
.step .check{flex:none;width:26px;height:26px;border:2px solid var(--primary-light);border-radius:7px;display:grid;place-items:center;color:#fff;background:var(--surface);transition:background .15s}
.step .check svg.ic{width:17px;height:17px;stroke-width:3}
.step.done{background:var(--primary-pale)}
.step.done .check{background:var(--primary);border-color:var(--primary)}
.step.next .text{font-weight:700}
.step.next .check{border-color:var(--primary)}
.step .body{flex:1;min-width:0}
.step .body .text{display:block}
.cnt-pill{flex:none;display:inline-flex;align-items:center;gap:2px;padding:3px 10px;border-radius:14px;background:var(--primary-pale);color:var(--primary);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt-pill .minus{border:none;background:none;color:var(--primary);width:22px;height:22px;margin-left:-6px;display:grid;place-items:center;padding:0;font-size:16px;line-height:1}
.cnt-next{display:block;font-size:11px;color:var(--primary);font-weight:600;margin-top:2px}
.cnt-bar{display:block;height:3px;border-radius:2px;background:var(--surface2);margin-top:5px;overflow:hidden;max-width:160px}
.cnt-bar span{display:block;height:100%;background:var(--primary)}
.step .tip{display:flex;align-items:flex-start;gap:4px;margin-top:3px;font-size:12px;color:var(--text2);white-space:pre-wrap;word-break:break-word}
.step .tip svg.ic{width:14px;height:14px;margin-top:1px;color:var(--primary)}
.step.pressing{background:var(--surface2)}
.list-hint{font-size:11px;color:var(--text3);text-align:right;margin:6px 2px 0}
.step .pause-note{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:12px;font-weight:700;color:var(--primary)}
.step .pause-note svg.ic{width:14px;height:14px;fill:currentColor}
.step.paused{background:var(--surface2);box-shadow:inset 4px 0 0 var(--primary)}
.step.paused .check{border-color:var(--primary);border-style:dashed}
.pause-btn{flex:none;border:none;background:none;color:var(--text3);width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.pause-btn.on{color:var(--primary)}
.pause-btn.on svg.ic{fill:currentColor}
.pause-btn svg.ic{width:19px;height:19px}
.quick-add{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;background:var(--surface2)}
.quick-add .row-in{flex:none;width:3.6em!important;text-align:center;padding:9px 4px!important}
.quick-add .dan,.edit-step .dan,.edit-add .dan{flex:none;font-size:12px;color:var(--text2);font-weight:600;min-width:3em;text-align:center}
.quick-add input{flex:1;min-width:0;background:var(--surface)!important;padding:9px 12px!important}
.quick-add .btn-icon{background:var(--primary);color:#fff}
.list > li.quick-add{border-top:1.5px dashed var(--border)}

/* 動画 */
.video{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;box-shadow:0 2px 6px var(--shadow);overflow:hidden;margin-bottom:14px}
.video-frame{position:relative;padding-top:56.25%;background:#000}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:13px}
.video-bar .grow{flex:1}
.video-bar a,.video-bar button{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-weight:600;text-decoration:none;border:none;background:none;font-size:13px}
.video-bar svg.ic{width:17px;height:17px}
.video-link{display:flex;align-items:center;gap:8px;padding:12px 14px;color:var(--primary);font-weight:600;font-size:14px;text-decoration:none;word-break:break-all}
.section-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--primary);margin:26px 0 8px}
.section-title svg.ic{width:18px;height:18px}

/* 記録 */
.record{padding:11px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.record:active{background:var(--primary-pale)}
.record .rbody{flex:1;min-width:0}
.record .chev{color:var(--text3)}
.record .rmemo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dates{display:flex;gap:10px}
.dates > div{flex:1;min-width:0}
.days{margin-top:8px;font-size:13px;font-weight:700;color:var(--primary)}
.timer{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:12px;box-shadow:0 2px 6px var(--shadow)}
.timer.on{border-color:var(--primary);background:var(--primary-pale)}
.timer > svg.ic{color:var(--primary)}
.timer .tbox{flex:1;min-width:0;line-height:1.25}
.timer .t{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.timer .tsub{font-size:11px;color:var(--text3)}
.timer.on .tsub{color:var(--primary);font-weight:700}
.timer .tedit{width:32px;height:32px;background:none;color:var(--text3)}
.timer .tbtn{padding:9px 14px;border-radius:20px}
.timer.on svg.clock{animation:blink 2s ease-in-out infinite}
.dur{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);white-space:nowrap}
.dur input{flex:1;min-width:0;max-width:4.6em;width:auto!important;text-align:center;padding:10px 4px!important}
.mat{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px 10px 14px;margin-bottom:12px;font-size:13px;color:var(--text2);cursor:pointer}
.mat.mat-empty{border-style:dashed;border-color:var(--primary-light);background:var(--primary-pale);color:var(--primary);font-weight:700;justify-content:center}
.mat > svg.ic{color:var(--primary)}
.mat .mbody{flex:1;min-width:0}
.mat .mlabel{display:block;font-size:11px;color:var(--text3);font-weight:600}
.mat .mval{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:600}
.mat .mpen{color:var(--text3)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sw{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(0,0,0,.15);padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary)}
.sw.none{background:var(--surface);color:var(--text3);font-size:10px}
.sw.pick{overflow:hidden;background:conic-gradient(#e57373,#f2d25c,#6cbf84,#8fd0e8,#a58ad6,#e57373)}
.sw.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cdot{display:inline-grid;place-items:center;flex:none}
.mat-sum{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text2);margin-top:12px}
.mat-sum b{display:block;font-size:11px;color:var(--text3);margin-bottom:2px}
.photo-box{margin:6px 0 4px;position:relative}
.pick-mark{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s}
.photo-lg{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:var(--surface2);}
.photo-hint{font-size:11px;color:var(--text3);margin-top:6px;text-align:center}
.sel-hint{font-size:12px;color:var(--primary);font-weight:600;margin:4px 0 0;min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 4px 4px 8px;border-radius:14px;background:var(--surface2);border:1.5px solid var(--border);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer}
.chip.on{border-color:var(--primary);background:var(--primary-pale);color:var(--primary)}
.chip .cdot svg,.chip > svg.ic{width:14px;height:14px}
.chip-x{border:none;background:none;color:var(--text3);width:20px;height:20px;display:grid;place-items:center;padding:0}
.chip-x svg.ic{width:13px;height:13px}
.sum-edit{float:right;border:none;background:none;color:var(--primary);font-weight:700;font-size:12px;padding:0}
.yarns{display:flex;flex-wrap:wrap;gap:4px 10px}
.yarns .yl{display:inline-flex;align-items:center;gap:4px}
.photo-btns{display:flex;gap:8px;margin-top:8px}
.photo-btns .btn{flex:1;padding:9px}
.photo-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border:2px dashed var(--primary-light);border-radius:12px;background:var(--primary-pale);color:var(--primary);font-size:14px;font-weight:700;cursor:pointer}
.file-in{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.photo-add,.photo-btns label{position:relative}
.thumb{flex:none;width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--surface2)}
.prev{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.prev button{text-align:left;border:1.5px solid var(--border);background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text2)}
.prev button:active{border-color:var(--primary);color:var(--primary)}
.prev .pdate{font-size:11px;color:var(--text3);margin-right:6px}
.rows-info{font-size:12px;font-weight:700;color:var(--primary);margin:-6px 0 4px;text-align:right}
.started{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--text3);margin:-6px 0 10px;cursor:pointer}
.started svg.ic{width:13px;height:13px}
.sheet-sub{font-size:13px;color:var(--text2);margin-bottom:4px}
.record-head{display:flex;align-items:center;gap:8px}
.record-head .date{font-weight:700;color:var(--text)}
.record-head .rname{flex:1;min-width:0;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.record-head .del{margin-left:auto;border:none;background:none;color:var(--text3);padding:4px;display:flex}
.record-head .del svg.ic{width:16px;height:16px}
.yarn{display:flex;align-items:center;gap:5px;color:var(--text2);margin-top:3px}
.yarn svg.ic{width:15px;height:15px;color:var(--primary)}
.rmemo{white-space:pre-wrap;margin-top:4px;color:var(--text2)}
.empty{text-align:center;color:var(--text3);padding:50px 20px;font-size:14px}
.empty .big{display:block;margin:0 auto 10px;width:44px;height:44px;color:var(--primary-light);stroke-width:1.5}
.note{font-size:13px;color:var(--text3);margin:4px 0 10px}

/* フォーム */
.label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:14px 0 4px}
input[type=text],input[type=date],input[type=password],input[type=number],textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--primary-light);background:var(--surface)}
input[type=checkbox]{accent-color:var(--primary);width:18px;height:18px}
textarea{resize:none}
.edit-steps{list-style:none}
.edit-step{display:flex;align-items:flex-start;gap:4px;margin-bottom:8px}
.edit-step .num{padding-top:11px;color:var(--text3);font-size:12px;min-width:1.5em}
.edit-step textarea{flex:1;min-width:0;min-height:46px}
.edit-step .row-in{flex:none;width:3.4em;text-align:center;padding:10px 4px}
.edit-step .dan{padding-top:12px}
.step-btns{display:flex;flex:none}
.mini{border:none;background:none;color:var(--text3);width:32px;height:44px;display:grid;place-items:center}
.mini:disabled{opacity:.25}
.mini svg.ic{width:18px;height:18px}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1}
.edit-add{align-items:center}
.edit-add .row-in{flex:none!important;width:3.4em;text-align:center;padding:10px 4px}
.edit-add .dan{flex:none;font-size:12px;color:var(--text2);font-weight:600}
.edit-add #newStep{min-width:0}
.bulk{margin:14px 0}
.bulk summary{color:var(--primary);font-size:13px;font-weight:600;cursor:pointer}
.bulk textarea{margin:8px 0}

/* 下部ナビ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:2px solid var(--border);box-shadow:0 -2px 10px var(--shadow);padding-bottom:env(safe-area-inset-bottom);z-index:200}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:none;background:none;color:var(--text3);font-size:10px}
.nav-item svg.ic{width:23px;height:23px}
.nav-item.active{color:var(--primary);font-weight:700}

/* 同期バッジ */
.sync-badge{flex:none;display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text3);padding:4px 8px;background:var(--surface2);border:none;border-radius:8px;white-space:nowrap}
.sync-badge svg.ic{width:14px;height:14px}
.sync-badge.ok{color:var(--primary)}
.sync-badge.error{color:var(--danger)}
.sync-badge.syncing svg{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}

/* 設定 */
.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 2px 6px var(--shadow);margin-bottom:14px}
.panel p,.panel ol{font-size:13px;color:var(--text2)}
.panel ol{padding-left:1.3em;margin:8px 0}
.status{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--text2);margin-bottom:10px}
.status.ok{background:var(--primary-pale);color:var(--primary)}
.status.error{background:#fdeceb;color:var(--danger)}
@media (prefers-color-scheme:dark){.status.error{background:#3a2322}}

/* 完成モーダル */
#modal{position:fixed;inset:0;background:rgba(20,50,42,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:1000}
#modal.open{display:flex}
.ask-msg{font-size:14px;color:var(--text);white-space:pre-wrap;margin:4px 0 4px}
.ask-sub{font-size:12px;color:var(--text3);white-space:pre-wrap;margin-top:6px}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.actions.col{flex-direction:column}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(20,50,42,.2)}
.sheet-close{margin-left:auto;border:none;background:none;color:var(--text3);width:36px;height:36px;margin-right:-8px;display:grid;place-items:center;border-radius:50%}
.sheet-close:active{background:var(--surface2)}
.sheet-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:var(--primary);margin-bottom:6px}
.warn{background:#fef9eb;color:#8a6a1f;padding:8px 12px;border-radius:10px;font-size:13px;margin-top:8px}
@media (prefers-color-scheme:dark){.warn{background:#3a321f;color:#e5c77a}}
.checkline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text2);margin-top:16px}

/* トースト */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(20px);background:var(--primary-dark);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:1100;white-space:nowrap;box-shadow:0 4px 12px var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ===== アイコン（SVG線画。外部読み込みなしでオフラインでも表示） ===== */
const ICONS = {
  copy:     '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
  bulb:     '<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/>',
  ruler:    '<path d="M21.3 15.3 8.7 2.7a1 1 0 0 0-1.4 0L2.7 7.3a1 1 0 0 0 0 1.4l12.6 12.6a1 1 0 0 0 1.4 0l4.6-4.6a1 1 0 0 0 0-1.4z"/><path d="m7.5 10.5 2-2"/><path d="m10.5 13.5 2-2"/><path d="m13.5 16.5 2-2"/>',
  camera:   '<path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5z"/><circle cx="12" cy="13" r="3.5"/>',
  clock:    '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M10 2h4"/>',
  play:     '<path d="M7 4.5v15l12-7.5z"/>',
  pause:    '<path d="M8 5v14"/><path d="M16 5v14"/>',
  hook:     '<path d="M4 20 16.5 7.5"/><path d="M16.5 7.5a2.3 2.3 0 1 1 3.2-3.2L18 6"/>',
  bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  video:    '<rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3"/>',
  ext:      '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  list:     '<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>',
  yarn:     '<circle cx="12" cy="12" r="8" fill="currentColor" fill-opacity=".22"/><circle cx="12" cy="12" r="8"/>',
  flower:   '<g fill="currentColor" fill-opacity=".18" stroke="none"><circle cx="12" cy="5.8" r="3.6"/><circle cx="17.9" cy="10.1" r="3.6"/><circle cx="15.6" cy="17" r="3.6"/><circle cx="8.4" cy="17" r="3.6"/><circle cx="6.1" cy="10.1" r="3.6"/></g><path d="M9.2 7.9a3.6 3.6 0 1 1 5.6 0a3.6 3.6 0 1 1 1.8 5.5a3.6 3.6 0 1 1-4.6 3.3a3.6 3.6 0 1 1-4.6-3.3a3.6 3.6 0 1 1 1.8-5.5z"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
  book:     '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  back:     '<path d="m15 18-6-6 6-6"/>',
  chev:     '<path d="m9 18 6-6-6-6"/>',
  up:       '<path d="m18 15-6-6-6 6"/>',
  down:     '<path d="m6 9 6 6 6-6"/>',
  x:        '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:    '<path d="M20 6 9 17l-5-5"/>',
  plus:     '<path d="M12 5v14"/><path d="M5 12h14"/>',
  pen:      '<path d="M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  reset:    '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  award:    '<circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/>',
  trash:    '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  cloud:    '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/>',
  cloudOff: '<path d="m2 2 20 20"/><path d="M5.78 5.78A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.31-.19"/><path d="M21.53 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7 7 0 0 0 10 5.07"/>',
};
const ic = name => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

/* ===== 基本 ===== */
const KEY = 'amimono-note';
const OLD_KEY = 'amime-check-v1';   // 旧名のデータがあれば引き継ぐ
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => (s || '').replaceAll('-', '/');
const daysBetween = (a, b) => { if (!a || !b) return null; const d = Math.round((Date.parse(b) - Date.parse(a)) / 864e5) + 1; return d > 0 ? d : null; };
// ---- タイマー（押した時刻を覚えて差を足す方式。アプリを閉じてもずれない） ----
const elapsed = p => (p.timer?.total || 0) + (p.timer?.running ? Date.now() - p.timer.running : 0);
const pad = n => String(n).padStart(2, '0');
const clock = ms => { const t = Math.floor(ms / 1000); return `${Math.floor(t / 3600)}:${pad(Math.floor(t / 60) % 60)}:${pad(t % 60)}`; };
const fmtMin = min => { if (!min) return ''; const h = Math.floor(min / 60), m = min % 60; return h ? `${h}時間${m ? pad(m) + '分' : ''}` : `${m}分`; };
function markDay(p) {   // 今日を「編んだ日」に加える
  const t = today();
  p.workDays = p.workDays || [];
  if (!p.workDays.includes(t)) p.workDays.push(t);
  if (!p.startedAt) p.startedAt = t;
}
function startTimer(p) {
  state.patterns.forEach(q => { if (q !== p && q.timer?.running) stopTimer(q); });   // 動かすのは1作品だけ
  p.timer = { total: p.timer?.total || 0, running: Date.now() };
  markDay(p);
}
function stopTimer(p, addMs) {
  if (!p.timer?.running) return;
  p.timer.total = (p.timer.total || 0) + (addMs ?? Date.now() - p.timer.running);
  p.timer.running = null;
}
// 進み具合だけ消す（タイマー・編んだ日・始めた日）。材料は残す
function clearProgress(p) { delete p.timer; delete p.workDays; delete p.startedAt; }
// 完成したとき：進み具合＋今回の材料も消して、次の1個へ
function clearRun(p) { clearProgress(p); delete p.run; }

// ---- 今回の材料（糸・針・作り目）：編みはじめに入れて、完成の記録へそのまま引き継ぐ ----
const castLabel = c => c ? (/^\d+$/.test(c) ? `${c}目` : c) : '';
// 糸は複数持てる：yarns = [{ name, hex }]。前の形（yarn/color/colorHex）も読めるようにする
const yarnsOf = m => Array.isArray(m?.yarns) ? m.yarns
  : (m?.yarn || m?.color) ? [{ name: [m.yarn, m.color].filter(Boolean).join(''), hex: m.colorHex || '' }] : [];
const hexesOf = m => yarnsOf(m).map(y => y.hex).filter(Boolean);
const matText = m => [yarnsOf(m).map(y => y.name).join('・'), m?.size, m?.hook, m?.cast ? '作り目' + castLabel(m.cast) : ''].filter(Boolean).join('　');
const okHex = h => /^#[0-9a-f]{6}$/i.test(h || '') ? h : '';
// 毛糸の色の○。色が複数なら○を色で分ける（色がなければいつもの○）
function colorDot(hexes, size = 18) {
  const cs = [].concat(hexes || []).map(okHex).filter(Boolean);
  if (!cs.length) return ic('yarn');
  const n = cs.length, pt = a => `${12 + 8.5 * Math.cos(a)} ${12 + 8.5 * Math.sin(a)}`;
  const body = n === 1 ? `<circle cx="12" cy="12" r="8.5" fill="${cs[0]}"/>`
    : cs.map((c, i) => { const a0 = -Math.PI / 2 + 2 * Math.PI * i / n, a1 = -Math.PI / 2 + 2 * Math.PI * (i + 1) / n;
        return `<path d="M12 12L${pt(a0)}A8.5 8.5 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${pt(a1)}Z" fill="${c}"/>`; }).join('');
  return `<span class="cdot"><svg width="${size}" height="${size}" viewBox="0 0 24 24">${body}<circle cx="12" cy="12" r="8.5" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="1.5"/></svg></span>`;
}
const COLORS = [
  ['生成り', '#f3ecd9'], ['白', '#ffffff'], ['ベージュ', '#d9c3a0'], ['茶', '#9b6b4a'], ['グレー', '#9aa3a7'], ['黒', '#3a3a3a'],
  ['赤', '#d9534f'], ['ピンク', '#f2a7b8'], ['オレンジ', '#f0a04b'], ['黄', '#f2d25c'], ['緑', '#6cbf84'], ['水色', '#8fd0e8'], ['青', '#4f7fd1'], ['紫', '#a58ad6'],
];
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function nearestName(hex) {   // いちばん近い色の名前
  const [r, g, b] = rgb(hex);
  return COLORS.map(([n, h]) => { const [R, G, B] = rgb(h); return [n, (r - R) ** 2 * 2 + (g - G) ** 2 * 4 + (b - B) ** 2 * 3]; }).sort((a, b) => a[1] - b[1])[0][0];
}
// 糸（タグ）・色・針・作り目の入力欄（今回の材料／完成／記録の編集で共通）
const firstSel = ys => { const i = ys.findIndex(y => !okHex(y.hex)); return i >= 0 ? i : ys.length - 1; };
const colorMode = () => false;   // 色は写真で見るので、色の入力はしない（前に入れた色のデータはそのまま残す）
function chipsHtml(px, ys, sel) {
  const c = colorMode(px);
  return ys.map((y, i) => `<span class="chip ${c && i === sel ? 'on' : ''}" ${c ? `data-action="chipsel" data-px="${px}" data-idx="${i}"` : ''}>${colorDot(y.hex, 14)}${esc(y.name || '色')}<button class="chip-x" data-action="chipdel" data-px="${px}" data-idx="${i}" aria-label="削除">${ic('x')}</button></span>`).join('');
}
function swatchesHtml(px, hex) {
  return `<button class="sw none ${hex ? '' : 'on'}" data-action="swatch" data-hex="" aria-label="色なし">なし</button>
    ${COLORS.map(([n, h]) => `<button class="sw ${hex === h ? 'on' : ''}" style="background:${h}" data-action="swatch" data-hex="${h}" data-name="${n}" aria-label="${n}"></button>`).join('')}
    <label class="sw pick ${hex && !COLORS.some(c => c[1] === hex) ? 'on' : ''}" aria-label="ほかの色"><input type="color" id="${px}Pick" value="${hex || '#2f9e7c'}"></label>`;
}
// 色の付け方の案内
//  ・糸をタップして選んだとき → その糸の色を直す
//  ・まだ色のない糸があるとき → その糸に付ける
//  ・全部の糸に色があるとき   → 新しい色（糸）として追加する
function selHint(px, ys, sel, explicit) {
  if (!colorMode(px)) return '';
  if (explicit && ys[sel]) return `「${ys[sel].name || '色'}」の色を直します（写真をタップ、または下の色から）`;
  const i = ys.findIndex(y => !okHex(y.hex));
  if (i >= 0) return `「${ys[i].name || '色'}」に色を付けます（写真をタップ、または下の色から）`;
  return '写真や色をタップすると、新しい色として追加します（直したいときは糸をタップ）';
}
function matFields(px, m = {}) {
  const ys = yarnsOf(m), sel = firstSel(ys), c = colorMode(px);
  return `<div class="matf" data-px="${px}">
    <label class="label">糸（スペースで確定）</label>
    <input type="hidden" id="${px}Yarns" value="${esc(JSON.stringify(ys))}">
    <div class="chips" id="${px}Chips" data-sel="${sel}">${chipsHtml(px, ys, sel)}</div>
    <input type="text" id="${px}YarnIn" class="yarn-in" data-px="${px}" placeholder="例：コットン生成り" enterkeyhint="done">
    ${c ? `<p class="sel-hint" id="${px}Hint">${esc(selHint(px, ys, sel, false))}</p><div class="swatches" data-px="${px}">${swatchesHtml(px, okHex(ys[sel]?.hex))}</div>` : ''}
    <label class="label">サイズ</label><input type="text" id="${px}Size" value="${esc(m.size || '')}" placeholder="例：文庫本">
    <div class="dates">
      <div><label class="label">針</label><input type="text" id="${px}Hook" class="hook-in" value="${esc(m.hook || '')}" placeholder="例：5（→5/0号）" inputmode="decimal"></div>
      <div><label class="label">作り目</label><input type="text" id="${px}Cast" value="${esc(m.cast || '')}" placeholder="例：30" inputmode="numeric"></div>
    </div></div>`;
}
const getYs = px => { try { return JSON.parse(document.getElementById(px + 'Yarns').value || '[]'); } catch (e) { return []; } };
function setYs(px, ys, sel, explicit = false) {
  document.getElementById(px + 'Yarns').value = JSON.stringify(ys);
  const chips = document.getElementById(px + 'Chips');
  chips.dataset.sel = sel; chips.dataset.explicit = explicit ? '1' : '';
  chips.innerHTML = chipsHtml(px, ys, explicit ? sel : -1);
  const sw = modal.querySelector(`.swatches[data-px="${px}"]`);
  if (sw) sw.innerHTML = swatchesHtml(px, okHex(ys[sel]?.hex));
  const hint = document.getElementById(px + 'Hint');
  if (hint) hint.textContent = selHint(px, ys, sel, explicit);
}
function addYarn(px, name) { const ys = getYs(px); ys.push({ name, hex: '' }); setYs(px, ys, firstSel(ys)); }
// 色を付ける
function applyColor(px, hex, name) {
  const ys = getYs(px), chips = document.getElementById(px + 'Chips');
  let sel = +chips.dataset.sel;
  const explicit = chips.dataset.explicit === '1' && ys[sel];
  if (!hex) {   // 「なし」：選んでいる糸の色を消す
    if (explicit) ys[sel].hex = '';
    setYs(px, ys, sel); return;
  }
  if (explicit) {                                        // タップして選んだ糸 → 直す
    ys[sel].hex = hex;
    if (COLORS.some(c => c[0] === ys[sel].name)) ys[sel].name = name || nearestName(hex);   // 色の名前だけの糸なら名前も合わせる
  }
  else {
    const i = ys.findIndex(y => !okHex(y.hex));
    if (i >= 0) ys[i].hex = hex;                         // 色のない糸 → 付ける
    else ys.push({ name: name || nearestName(hex), hex });   // 全部付いている → 追加
  }
  setYs(px, ys, firstSel(ys));
}
function flushYarnIn(px) {   // 入力途中の文字も糸として確定
  const i = document.getElementById(px + 'YarnIn');
  if (i && i.value.trim()) { addYarn(px, i.value.trim()); i.value = ''; }
}
// かぎ針の号数：「7」「7/0」→「7/0号」、「7.5」→「7.5/0号」。mmなどはそのまま
function normHook(h) {
  h = String(h || '').trim().replace(/[０-９．／]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  if (/^\d+(\.\d+)?$/.test(h)) return `${h}/0号`;
  if (/^\d+(\.\d+)?\/0$/.test(h)) return `${h}号`;
  return h;
}
const readMat = (v, px) => {
  let ys = []; try { ys = JSON.parse(v[px + 'Yarns'] || '[]'); } catch (e) {}
  const pend = (v[px + 'YarnIn'] || '').trim(); if (pend) ys.push({ name: pend, hex: '' });
  ys = ys.filter(y => y.name || y.hex).map(y => ({ name: String(y.name || '').trim(), hex: okHex(y.hex) }));
  return { yarns: ys, yarn: undefined, color: undefined, colorHex: undefined,
    size: (v[px + 'Size'] || '').trim(), hook: normHook(v[px + 'Hook']), cast: (v[px + 'Cast'] || '').trim().replace(/目$/, '') };
};
const inputVals = () => { const v = {}; modal.querySelectorAll('input,textarea').forEach(i => { if (i.id) v[i.id] = i.value; }); return v; };

// 写真をタップして色を拾う
// 毛糸は影やテカリが混ざるので、タップした周り（写真の約6%の範囲）から
// 暗すぎる所・明るすぎる所を除いて、残りの真ん中の色を使う
const photoCanvas = {};
function pickFromPhoto(e, img) {
  if (!img.naturalWidth) return;
  if (!document.getElementById('mChips')) expandMat();
  const r = img.getBoundingClientRect(), k = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
  const ox = (r.width - img.naturalWidth * k) / 2, oy = (r.height - img.naturalHeight * k) / 2;
  const x = Math.round((e.clientX - r.left - ox) / k), y = Math.round((e.clientY - r.top - oy) / k);
  if (x < 0 || y < 0 || x >= img.naturalWidth || y >= img.naturalHeight) return;
  let c = photoCanvas[img.src];
  if (!c) {
    c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0); photoCanvas[img.src] = c;
  }
  const rad = Math.max(6, Math.round(Math.min(c.width, c.height) * 0.03));
  const x0 = Math.max(0, x - rad), y0 = Math.max(0, y - rad);
  const w = Math.min(c.width, x + rad + 1) - x0, h = Math.min(c.height, y + rad + 1) - y0;
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(x0, y0, w, h).data;
  const px = [];
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    if ((x0 + i - x) ** 2 + (y0 + j - y) ** 2 > rad * rad) continue;   // 円の中だけ
    const o = (j * w + i) * 4, R = d[o], G = d[o + 1], B = d[o + 2];
    px.push([R, G, B, 0.299 * R + 0.587 * G + 0.114 * B]);
  }
  px.sort((a, b) => a[3] - b[3]);
  const mid = px.slice(Math.floor(px.length * 0.3), Math.ceil(px.length * 0.85));   // 影(暗い30%)とテカリ(明るい15%)を除く
  const med = ch => { const v = mid.map(p => p[ch]).sort((a, b) => a - b); return v[Math.floor(v.length / 2)]; };
  const hex = '#' + [0, 1, 2].map(ch => med(ch).toString(16).padStart(2, '0')).join('');
  applyColor('m', hex);
  // タップした場所に、拾った色の丸を少し出す
  const box = document.getElementById('photoBox'), br = box.getBoundingClientRect();
  box.querySelector('.pick-mark')?.remove();
  const mk = document.createElement('div'); mk.className = 'pick-mark';
  mk.style.cssText = `left:${e.clientX - br.left}px;top:${e.clientY - br.top}px;background:${hex}`;
  box.appendChild(mk); setTimeout(() => { mk.style.opacity = '0'; setTimeout(() => mk.remove(), 400); }, 1200);
  toast(`${nearestName(hex)}っぽい色を拾いました`);
}

const daysLabel = r => { const d = daysBetween(r.start, r.date); return [d ? `${d}日` : '', fmtMin(r.timeMin)].filter(Boolean).join('・'); };

// 「1段目：細編み」「3〜5段 長編み」のように書かれていたら段数と内容に分ける
// 末尾の「×4」「x4」「*4」「×4回」を回数として取り出す
// 回数の書き方
//  ・「×10」「×10段」「10段」→ 10段くり返し（段数に反映）
//  ・「×4回」「×4目」       → 1つの段の中で4回チェック（段数は増えない）
function splitCount(text) {
  const num = v => parseInt(v.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)));
  const c = String(text).match(/^(.*?)\s*[×xX＊*✕]\s*([0-9０-９]+)\s*[回目]\s*$/);
  if (c && c[1].trim()) { const n = num(c[2]); return n >= 2 ? { text: c[1].trim(), count: Math.min(n, 99) } : { text: c[1].trim() }; }
  const r = String(text).match(/^(.*?)\s*(?:[×xX＊*✕]\s*([0-9０-９]+)\s*段?|([0-9０-９]+)\s*段)\s*$/);
  if (r && r[1].trim()) { const n = num(r[2] || r[3]); if (n >= 2) return { text: r[1].trim(), rows: Math.min(n, 999) }; return { text: r[1].trim() }; }
  return { text: String(text).trim() };
}
// 段数の書き方をそろえる：「1-10」「1~10」「1ー10」→「1〜10」、「段目」は取る
const normRow = r => String(r || '').trim().replace(/段目?$/, '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\s*[~\-ー－〜]\s*/, '〜');
const rangeLen = r => { const m = String(r || '').match(/^(\d+)〜(\d+)$/); return m && +m[2] > +m[1] ? +m[2] - +m[1] + 1 : 0; };
// 「1〜10段目」のように範囲なら、1段編むごとにチェック（10段ぶん）
function autoRange(st) {
  const len = rangeLen(st.row);
  if (len > 1 && !(st.count > 1)) { st.count = len; st.n = st.n || 0; st.byRow = true; }
  if (!len && st.byRow) { delete st.count; delete st.n; delete st.byRow; }
  return st;
}
function withCount(st) {
  const c = splitCount(st.text);
  if (c.rows) return { ...st, text: c.text, rowsN: c.rows };
  return c.count ? { ...st, text: c.text, count: c.count, n: 0 } : st;
}
// 「×10段」だったら、始まりの段から10段ぶんの範囲にする（例：3段目から → 3〜12段目）
function applyRows(st, startRow) {
  if (!st.rowsN) return st;
  const m = String(st.row || startRow || '').match(/^(\d+)/);
  const a = m ? +m[1] : 1;
  st.row = `${a}〜${a + st.rowsN - 1}`;

  return autoRange(st);
}
function parseStep(text) {
  const z = String(text).match(/^\s*(?:0\s*段目?|作り目)\s*[：:、,\s]\s*(.+)$/);   // 「作り目：くさり30目」→ 0（作り目）
  if (z) return withCount({ row: '0', text: z[1].trim() });
  const m = String(text).match(/^\s*(\d+(?:\s*[〜~\-ー－]\s*\d+)?)\s*段目?\s*[：:、,\s]\s*(.+)$/);
  return withCount(m ? { row: m[1].replace(/\s+/g, '').replace(/[~\-ー－]/, '〜'), text: m[2].trim() } : { row: '', text: String(text).trim() });
}
// 0段目は「作り目」と表示する（かぎ針編みは最初に必ず作り目があるので）
const rowLabel = r => r === '0' ? '作り目' : r ? `${r}段目` : '';
const danLabel = r => String(r).trim() === '0' ? '作り目' : '段目';
// 次の段数の候補：最後の工程の段数（範囲なら終わりの数）＋1
// 次の段数の候補：いちばん最後に段数が入っている工程の＋1。まだ1つもなければ1段目
// 全体の段数（作り目は数えない）。工程の段数から自動で出す
function totalRows(steps) {
  let max = 0;
  steps.forEach(st => { const m = String(st.row || '').match(/(\d+)$/); if (m) max = Math.max(max, +m[1]); });

}
// いま編んでいる段（まだチェックしていない最初の工程の段）
function currentRow(steps) {
  const st = steps.find(x => !x.done);

  if (!m) return null;

}
function nextRow(steps) {
  for (let i = steps.length - 1; i >= 0; i--) {
    const m = String(steps[i].row || '').match(/(\d+)$/);
    if (m) return String(+m[1] + 1);
  }

  // すでに段数なしの工程がある（作り目として入れた「鎖編み」など）なら1段目から

}

const normalize = d => ({ patterns: Array.isArray(d?.patterns) ? fixSteps(d.patterns) : [], records: Array.isArray(d?.records) ? d.records : [], updatedAt: d?.updatedAt || 0 });

/* IndexedDBにも同じ内容を控えておく（localStorageだけ消えたときの保険。writing-studioと同じ方式） */
function idb() {
  return new Promise((ok, ng) => {
    const r = indexedDB.open('amimono-note', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
  });
}
async function idbSet(k, v) { try { const db = await idb(); db.transaction('kv', 'readwrite').objectStore('kv').put(JSON.stringify(v), k); } catch (e) {} }

async function idbGet(k) {
  try {
    const db = await idb();
    return await new Promise(ok => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result ? JSON.parse(r.result) : null); r.onerror = () => ok(null); });
  } catch (e) { return null; }
}

/* ===== クラウド同期（GitHub Gist） =====
   ・変更は自動でGistに保存（1.5秒まとめて送信）
   ・起動時／アプリに戻ったときにGistを確認し、新しいほうを採用
   ・キャッシュを消しても、トークンを入れ直せばGistから復元できる */
const SYNC_KEY = 'amimono-note-sync';
const FILE = 'amimono-note.json';
let sync = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } })();
let syncStatus = sync.token ? 'syncing' : 'off';   // off / syncing / ok / error
let syncError = '';

function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {} idbSet('sync', sync); }

async function gh(path, opts = {}) {
  const res = await fetch('https://api.github.com' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + sync.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }
  });
  if (!res.ok) {
    const e = new Error(String(res.status)); e.status = res.status; throw e;
  }
  return res.json();
}
// あみものノートのGistを探す。いくつもある場合は、いちばん最近更新されたものを使う
let gistCount = 0;
async function findGist() {
  const found = [];
  for (let page = 1; page <= 10; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    list.forEach(g => { if (g.files && g.files[FILE]) found.push(g); });
    if (list.length < 100) break;
  }
  gistCount = found.length;
  found.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
  return found[0]?.id || null;
}
async function readGist() {
  const g = await gh('/gists/' + sync.gistId);
  const f = g.files[FILE];
  if (!f) return null;
  const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  return normalize(JSON.parse(text));
}
async function writeGist(keepalive = false) {
  const files = { [FILE]: { content: JSON.stringify(state) } };
  if (sync.gistId) {
    await gh('/gists/' + sync.gistId, { method: 'PATCH', body: JSON.stringify({ files }), keepalive });
  } else {
    const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'あみものノート データ', public: false, files }) });
    sync.gistId = g.id; saveSync();
  }
}

function setSync(status, err = '') {
  syncStatus = status; syncError = err;
  const b = document.getElementById('syncBadge');
  if (b) b.outerHTML = syncBadge();
  if (view.screen === 'settings' && !document.activeElement?.matches('input')) render();
}
function errText(e) {
  if (!navigator.onLine) return 'オフラインです。つながったら自動で保存します';
  if (e.status === 401) return 'トークンが無効です。入れ直してください';
  if (e.status === 403 || e.status === 404) return 'Gistにアクセスできません。トークンの権限を確認してください';
  return '保存に失敗しました。あとで自動で再試行します';
}

function schedulePush() {
  if (!sync.token) return;
  dirty = true; setSync('syncing');
  clearTimeout(pushTimer); pushTimer = setTimeout(flush, 1500);
}
async function flush(keepalive = false) {
  if (!sync.token || !dirty) return;
  if (busy) { pushTimer = setTimeout(flush, 800); return; }
  busy = true; dirty = false; clearTimeout(pushTimer);
  try { await writeGist(keepalive); if (!keepalive) await pushPhotos(); setSync(dirty ? 'syncing' : 'ok'); }
  catch (e) { dirty = true; setSync('error', errText(e)); }
  finally { busy = false; }
}
// クラウドと突き合わせ：新しいほうを採用
async function pull() {
  if (!sync.token || busy || dirty) return;
  busy = true; setSync('syncing');
  try {
    if (!sync.gistId) { sync.gistId = await findGist(); saveSync(); }
    const remote = sync.gistId ? await readGist() : null;
    if (remote && remote.updatedAt > state.updatedAt) {
      state = remote; store(); syncTimerNote();
      if (view.screen !== 'edit') update();
    } else if (!remote || state.updatedAt > remote.updatedAt) {
      dirty = true;
    }
    setSync('ok');
  } catch (e) { setSync('error', errText(e)); }
  finally { busy = false; }
  if (dirty) flush();
  pullPhotos().catch(() => {});
}
async function connect(token) {
  sync = { token }; photoUp = new Set(); savePhotoUp(); setSync('syncing');
  try {
    sync.gistId = await findGist(); saveSync();   // トークンが通ってから保存する
    const remote = sync.gistId ? await readGist() : null;
    if (remote && !isEmpty(remote)) {
      let pick = 'a';
      if (!isEmpty(state)) {
        pick = await askChoice(`クラウドに保存されたデータ（作品 ${remote.patterns.length} 件・記録 ${remote.records.length} 件）があります。どちらを使いますか？`,

        if (!pick) { sync = {}; saveSync(); setSync('off'); return; }   // やめた場合は接続しない
      }
      if (pick === 'a') { state = remote; store(); setSync('ok'); go('home'); toast('クラウドから復元しました'); pullPhotos().catch(() => {}); return; }
    }
    dirty = true; await flush();
    if (syncStatus === 'ok') toast('クラウド保存をはじめました');
  } catch (e) {
    if (!localStorage.getItem(SYNC_KEY) || !JSON.parse(localStorage.getItem(SYNC_KEY)).token) { sync = {}; setSync('off', errText(e)); }
    else setSync('error', errText(e));
  }
}
function disconnect() {
  clearTimeout(pushTimer); dirty = false;
  photoUp = new Set(); savePhotoUp();

/* ===== 写真（1記録1枚。小さくしてIndexedDBへ、クラウドは写真専用のGistへ1枚ずつ） ===== */
const photoCache = {};
async function getPhoto(id) {
  if (!id) return null;
  if (photoCache[id]) return photoCache[id];
  const d = await idbGet('photo:' + id);
  if (d) photoCache[id] = d;
  return d;
}
function putPhoto(id, data) { photoCache[id] = data; return idbSet('photo:' + id, data); }
function delPhoto(id) { if (!id) return; delete photoCache[id]; idbDel('photo:' + id); }
// 横800pxまでに縮めてJPEGに（1枚およそ100KB）
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.75);
  } finally { URL.revokeObjectURL(url); }
}
// data-photo の付いた<img>に写真を入れる
function hydratePhotos(root = document) {
  root.querySelectorAll('img[data-photo]').forEach(async img => {
    const d = await getPhoto(img.dataset.photo);
    if (d) img.src = d; else img.style.visibility = 'hidden';
  });
}

const PFILE = 'amimono-note-photos.json';
const UP_KEY = 'amimono-note-photos-up';
let photoUp = new Set((() => { try { return JSON.parse(localStorage.getItem(UP_KEY)) || []; } catch (e) { return []; } })());
const savePhotoUp = () => { try { localStorage.setItem(UP_KEY, JSON.stringify([...photoUp])); } catch (e) {} };
const usedPhotos = () => new Set(state.records.map(r => r.photo).filter(Boolean));
async function findPhotoGist() {

// まだ送っていない写真を送り、使わなくなった写真を消す（5枚ずつ）

  const gone = [...photoUp].filter(id => !want.has(id));

  if (!sync.photoGistId) {
    const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'あみものノート 写真', public: false, files: { [PFILE]: { content: '{"app":"amimono-note-photos"}' } } }) });
    sync.photoGistId = g.id; saveSync();
  }
  for (let i = 0; i < add.length; i += 5) {
    const files = {};
    add.slice(i, i + 5).forEach(([id, d]) => files[`p-${id}.txt`] = { content: d });
    await gh('/gists/' + sync.photoGistId, { method: 'PATCH', body: JSON.stringify({ files }) });
    add.slice(i, i + 5).forEach(([id]) => photoUp.add(id)); savePhotoUp();
  }
  if (gone.length) {
    const files = {}; gone.forEach(id => files[`p-${id}.txt`] = null);
    await gh('/gists/' + sync.photoGistId, { method: 'PATCH', body: JSON.stringify({ files }) }).catch(() => {});
    gone.forEach(id => photoUp.delete(id)); savePhotoUp();
  }
}
// この端末にない写真だけクラウドから取ってくる
async function pullPhotos() {
  if (!sync.token) return;
  const missing = [];
  for (const id of usedPhotos()) if (!(await getPhoto(id))) missing.push(id);
  if (!missing.length) return;
  if (!sync.photoGistId) { sync.photoGistId = await findPhotoGist(); saveSync(); }
  if (!sync.photoGistId) return;
  const g = await gh('/gists/' + sync.photoGistId);
  for (const id of missing) {
    const f = g.files[`p-${id}.txt`];
    if (!f) continue;
    const d = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    await putPhoto(id, d); photoUp.add(id);
  }
  savePhotoUp(); hydratePhotos();
}

// 記録フォームの写真欄。pendingPhoto：undefined＝そのまま／null＝外す／文字列＝新しい写真
let pendingPhoto;
function photoBox(id) {

  return `${img}<div class="photo-btns"><label class="btn outline">${ic('camera')}変える${input}</label><button class="btn" data-action="photodel">外す</button></div>`;
}
function refreshPhotoBox() {

// 保存時：新しい写真ならIDを振ってしまう。戻り値は記録に入れる写真ID
async function commitPhoto(oldId) {
  if (pendingPhoto === undefined) return oldId;
  if (oldId) delPhoto(oldId);
  if (pendingPhoto === null) return undefined;

}

function youtubeId(url) {
  try {
    const u = new URL(url.trim());
    const h = u.hostname.replace(/^(www\.|m\.)/, '');
    if (h === 'youtu.be') return u.pathname.slice(1).split('/')[0];
    if (h === 'youtube.com' || h === 'music.youtube.com') {
      if (u.searchParams.get('v')) return u.searchParams.get('v');
      const m = u.pathname.match(/^\/(shorts|live|embed)\/([\w-]+)/);
      if (m) return m[2];
    }
  } catch (e) {}
  return null;
}

// しおり（編み途中の印）。pause が文字列なら途中、undefined なら付いていない
const isPaused = st => typeof st.pause === 'string' && !st.done;
function setPause(p, i) {
  const st = p.steps[i];

function timerView(p) {

    ${ic('clock').replace('class="ic"', 'class="ic clock"')}
    <div class="tbox"><span class="t" id="timerTime">${clock(ms)}</span><span class="tsub">${on ? '編んでいます' : ms ? '合計の時間' : 'タイマー'}</span></div>

}
const durInputs = (min = 0) => `<div class="dur"><input type="number" id="dH" min="0" inputmode="numeric" value="${min ? Math.floor(min / 60) : ''}" placeholder="0">時間<input type="number" id="dM" min="0" max="59" inputmode="numeric" value="${min ? min % 60 : ''}" placeholder="0">分</div>`;
const readDur = v => (parseInt(v.dH) || 0) * 60 + (parseInt(v.dM) || 0);

// 時間の手入力：「今日だいたい1時間編んだ」を足す／合計を直す
function editTimer(p) {
  const on = !!p.timer?.running, min = Math.round(elapsed(p) / 60000);

    </div>`);

    if (!v) return;
    const input = readDur(formVals) * 60000, cur = elapsed(p);

    if (v === 'add') markDay(p);   // 足した日は「編んだ日」に数える
    p.updatedAt = Date.now(); save(); update();
    if (v === 'add') toast(`${fmtMin(Math.round(input / 60000))}足しました`);

}
// 始めた日・編んだ日を直す（試しにチェックしただけ、などのとき）
function editStart(p) {
  sheet(`<div class="sheet-title">${ic('clock')}始めた日<button class="sheet-close" data-action="modal-close" aria-label="閉じる">${ic('x')}</button></div>

// 何時間も動きっぱなしなら、戻ってきたときに聞く
function checkLongTimer() {

// 工程を長押し → その工程の編集（段数・内容・ワンポイント・削除）
function openStepEdit(i) {
  const p = findP(view.id), st = p?.steps[i];
  if (!st) return;
  sheet(`<div class="sheet-title">${ic('pen')}工程を直す<button class="sheet-close" data-action="modal-close" aria-label="閉じる">${ic('x')}</button></div>
    <div class="add-row" style="align-items:center">
      <input type="text" id="sRow" class="row-in" value="${esc(st.row || '')}" inputmode="tel" placeholder="-" style="flex:none;width:4em;text-align:center" aria-label="段数"><span class="dan" id="sDan">${danLabel(st.row || '')}</span>
      <input type="text" id="sText" value="${esc(st.text)}" placeholder="例：細編み">
    </div>
    <label class="label">チェックの回数（1なら普通のチェック）</label>
    <div class="dur"><input type="number" id="sCount" min="1" max="99" inputmode="numeric" value="${st.count || 1}">回</div>
    <label class="label">ワンポイント</label>
    <textarea id="sNote" rows="3" placeholder="例：角は3目編み入れる">${esc(st.note || '')}</textarea>
    <div class="actions"><button class="btn danger" data-ans="del">${ic('trash')}削除</button><button class="btn primary" data-ans="save">保存</button></div>`);
  setTimeout(() => document.getElementById(st.note ? 'sText' : 'sNote')?.focus(), 80);
  modalResolve = v => {
    if (v === 'save') {
      const text = (formVals.sText || '').trim();
      if (!text) { toast('工程の内容を入れてください'); return; }
      st.row = normRow(formVals.sRow);
      const c = splitCount(text);
      st.text = c.text;
      if (c.rows) { st.rowsN = c.rows; applyRows(st); }
      const len = rangeLen(st.row);
      let cnt = c.count || Math.max(1, Math.min(99, parseInt(formVals.sCount) || 1));
      if (len > 1 && cnt <= 1) cnt = len;   // 範囲の段数なら、段の数だけ数える
      if (len > 1 && cnt === len) st.byRow = true; else delete st.byRow;
      if (cnt > 1) { st.count = cnt; st.n = Math.min(st.n || 0, cnt); st.done = st.n >= cnt; }
      else { if (st.count) st.done = (st.n || 0) >= st.count && !!st.done; delete st.count; delete st.n; }
      const note = (formVals.sNote || '').trim();
      if (note) st.note = note; else delete st.note;
      p.updatedAt = Date.now(); save(); update(); toast('保存しました');
    }
    if (v === 'del') {
      askConfirm(`「${(st.row ? rowLabel(st.row) + ' ' : '') + st.text}」を削除しますか？`, { ok: '削除', danger: true }).then(ok => {
        if (ok) { p.steps.splice(p.steps.indexOf(st), 1); p.updatedAt = Date.now(); save(); update(); toast('削除しました'); }
      });
    }
  };
}
let lpTimer = null, lpStart = null, lpEl = null, suppressClick = 0;
function lpCancel() { clearTimeout(lpTimer); lpTimer = null; lpEl?.classList.remove('pressing'); lpEl = null; }
document.addEventListener('pointerdown', e => {
  const st = e.target.closest('.step');
  if (!st || e.target.closest('.pause-btn') || view.screen !== 'pattern') return;
  lpCancel(); lpEl = st; lpStart = [e.clientX, e.clientY];
  st.classList.add('pressing');
  lpTimer = setTimeout(() => {
    const i = +st.dataset.idx; lpCancel();
    suppressClick = Date.now() + 700;   // 指を離したときのタップでチェックが付かないように
    navigator.vibrate?.(15);
    openStepEdit(i);
  }, 500);
});
document.addEventListener('pointermove', e => { if (lpTimer && Math.hypot(e.clientX - lpStart[0], e.clientY - lpStart[1]) > 10) lpCancel(); });
['pointerup', 'pointercancel', 'scroll'].forEach(t => document.addEventListener(t, () => { if (lpTimer) lpCancel(); }, true));
document.addEventListener('contextmenu', e => { if (e.target.closest('.step')) e.preventDefault(); });

function patternBody(p) {
  const { done, total, pct } = progressOf(p);
  const nextIdx = p.steps.findIndex(x => !x.done);
  const steps = p.steps.map((st, i) => `
    <li class="step ${st.done ? 'done' : ''} ${i === nextIdx ? 'next' : ''} ${isPaused(st) ? 'paused' : ''}" data-action="toggle" data-idx="${i}">
      ${p.steps.some(x => x.row) ? `<span class="row-no">${esc(rowLabel(st.row))}</span>` : ''}
      <span class="body"><span class="text">${esc(st.text)}</span>${st.count > 1 && !st.done ? `<span class="cnt-bar"><span style="width:${Math.round((st.n || 0) / st.count * 100)}%"></span></span>${st.byRow ? `<span class="cnt-next">次は${+String(st.row).split('〜')[0] + (st.n || 0)}段目</span>` : ''}` : ''}${st.note ? `<span class="tip">${ic('bulb')}<span>${esc(st.note)}</span></span>` : ''}${isPaused(st) ? `<span class="pause-note">${ic('bookmark')}途中${st.pause ? '：' + esc(st.pause) : ''}</span>` : ''}</span>
      ${!st.done && (i === nextIdx || isPaused(st)) ? `<button class="pause-btn ${isPaused(st) ? 'on' : ''}" data-action="pause" data-idx="${i}" aria-label="しおり（編み途中の印）">${ic('bookmark')}</button>` : ''}
      ${st.count > 1 ? `<span class="cnt-pill">${(st.n || 0) > 0 && !st.done ? `<button class="minus" data-action="cntdown" data-idx="${i}" aria-label="1つ戻す">−</button>` : ''}${st.n || 0} / ${st.count}${st.byRow ? '段' : ''}</span>` : ''}
      <span class="check" role="checkbox" aria-checked="${!!st.done}">${st.done ? ic('check') : ''}</span>
    </li>`).join('');
  const recs = recordsOf(p.id).sort(byDateDesc);
  return `
    ${matView(p)}
    ${timerView(p)}
    <div class="progress"><div class="bar"><span style="width:${pct}%"></span></div><div>${done} / ${total}</div></div>
    ${totalRows(p.steps) ? `<p class="rows-info">全${totalRows(p.steps)}段${currentRow(p.steps) !== null ? `・いま${currentRow(p.steps) === 0 ? '作り目' : currentRow(p.steps) + '段目'}` : '・全部編み終わりました'}</p>` : ''}
    ${p.startedAt ? `<p class="started" data-action="startedit" role="button">${fmtDate(p.startedAt)} から ${daysBetween(p.startedAt, today())}日目・編んだ日 ${(p.workDays || []).length}日${ic('pen')}</p>` : ''}
    <ol class="list">
      ${steps}
      <li class="quick-add"><input type="text" class="row-in" id="quickRow" value="${esc(nextRow(p.steps))}" data-auto="${esc(nextRow(p.steps))}" inputmode="tel" placeholder="-" aria-label="段数（1-10で範囲）"><span class="dan" id="quickDan">${danLabel(nextRow(p.steps))}</span><input type="text" id="quickStep" placeholder="${total ? '次の工程（×10で10段・×4回で4回）' : '例：鎖編み30目'}" enterkeyhint="enter"><button class="btn-icon" data-action="quickadd" aria-label="追加">${ic('plus')}</button></li>
    </ol>
    ${total ? '<p class="list-hint">工程を長押しすると、直したりワンポイントを付けたりできます</p>' : ''}
    <div class="actions">
      <button class="btn primary" data-action="complete" ${total ? '' : 'disabled'}>${ic('award')}完成！記録する</button>
      <button class="btn outline" data-action="reset" ${done ? '' : 'disabled'}>${ic('reset')}チェックを外す</button>
    </div>
    <div class="section-title">${ic('book')}この作品の記録（${recs.length}）</div>
    ${recs.length ? `<ul class="list">${recs.map(r => recordItem(r)).join('')}</ul>` : '<p class="note">まだ記録はありません。</p>'}`;
}

// 工程チェック画面なら動画を残して下だけ更新。それ以外は全体を描き直す
function update() {
  const box = document.getElementById('pbody'), p = findP(view.id);
  if (view.screen !== 'pattern' || !box || !p) { render(); return; }
  const q = document.getElementById('quickStep');
  const r = document.getElementById('quickRow');
  const typed = q?.value || '', typedRow = r?.value, focus = document.activeElement?.id;
  const rowEdited = r && typedRow !== r.dataset.auto;   // 自分で段数を打ち替えていたときだけ、その値を残す
  box.innerHTML = patternBody(p); hydratePhotos(box);
  document.getElementById('quickStep').value = typed;
  if (rowEdited) { document.getElementById('quickRow').value = typedRow; document.getElementById('quickDan').textContent = danLabel(typedRow); }
  if (focus === 'quickStep' || focus === 'quickRow') document.getElementById(focus).focus();
}

function quickAdd() {
  const p = findP(view.id), q = document.getElementById('quickStep'), r = document.getElementById('quickRow');
  if (!p || !q.value.trim()) return;
  const typedRow = normRow(r.value);
  const ps = parseStep(q.value);   // 「作り目：〜」「3段目：〜」と書いてあれば、そちらを優先
  const st = autoRange(applyRows(ps.row ? ps : { ...ps, row: typedRow }, typedRow || nextRow(p.steps)));
  p.steps.push({ id: uid(), ...st, done: false });
  p.updatedAt = Date.now();
  q.value = ''; r.value = nextRow(p.steps);   // 次の段数を自動で入れておく
  save(); update();
  document.getElementById('quickStep').focus();
}

function recordItem(r, showName = false) {
  const name = findP(r.patternId)?.name || r.patternName;

  return `<li class="record" data-action="viewrec" data-id="${r.id}">
    ${r.photo ? `<img class="thumb" data-photo="${esc(r.photo)}" alt="">` : ''}

/* 作品の作成・編集 */

}

    <p>変更は自動で保存されます。ほかの端末でも同じトークンを入れると、同じデータを使えます。</p>
    ${sync.gistId ? `<p class="note">保存先：…${esc(sync.gistId.slice(-6))}（端末どうしでこの文字が同じなら、同じ保存先です）</p>` : ''}
    ${gistCount > 1 ? `<p class="warn">あみものノートの保存先が ${gistCount} 個見つかりました。いちばん新しいものを使っています。</p>` : ''}
    <button class="btn outline block" data-action="syncnow">${ic('reset')}今すぐ同期する</button>

function openComplete(p) {
  pendingPhoto = undefined;
  const { done, total } = progressOf(p);
  const warn = done < total ? `<p class="warn">未チェックの工程が ${total - done} 個あります。このまま記録しますか？</p>` : '';
  modal.innerHTML = `<div class="sheet">
    <div class="sheet-title">${ic('award')}完成おめでとうございます</div>${warn}
    ${recordForm({ ...(p.run || {}), start: p.startedAt || '', date: today(), timeMin: Math.round(elapsed(p) / 60000), workDays: (p.workDays || []).length, rows: totalRows(p.steps) }, true)}
    <label class="checkline"><input type="checkbox" id="mReset" checked> チェックをすべて外して、また作れる状態にする</label>
    <div class="actions"><button class="btn" data-action="modal-close">やめる</button><button class="btn primary" data-action="modal-save">記録する</button></div>
  </div>`;
  modal.classList.add('open'); hydratePhotos(modal);
}

// 記録の確認・編集
function openRecord(id) {
  const r = state.records.find(x => x.id === id);
  if (!r) return;
  pendingPhoto = undefined;
  const name = findP(r.patternId)?.name || r.patternName;
  modal.innerHTML = `<div class="sheet">
    <div class="sheet-title">${ic('book')}完成の記録<button class="sheet-close" data-action="modal-close" aria-label="閉じる">${ic('x')}</button></div>
    <p class="sheet-sub">${esc(name)}</p>
    ${recordForm(r)}
    <div class="actions"><button class="btn danger" data-action="delrec" data-id="${r.id}">${ic('trash')}削除</button><button class="btn primary" data-action="saverec" data-id="${r.id}">保存</button></div>
  </div>`;
  modal.classList.add('open'); hydratePhotos(modal);
}
async function saveRecord(id) {
  const r = state.records.find(x => x.id === id);
  if (!r) return;
  const f = readForm();
  f.photo = await commitPhoto(r.photo);
  Object.assign(r, f);
  save(); closeModal(); update(); toast('記録を保存しました');
}
let modalResolve = null, formVals = {};
function closeModal() { modal.classList.remove('open'); modal.innerHTML = ''; const r = modalResolve; modalResolve = null; r?.(null); }
function sheet(html) { modal.innerHTML = `<div class="sheet">${html}</div>`; modal.classList.add('open'); }
function answer(v) { const r = modalResolve; modalResolve = null; modal.classList.remove('open'); modal.innerHTML = ''; r?.(v); }
// はい／いいえ。OKなら true
function askConfirm(msg, { ok = 'OK', cancel = 'やめる', danger = false, sub = '' } = {}) {
  return new Promise(res => {
    sheet(`<p class="ask-msg">${esc(msg)}</p>${sub ? `<p class="ask-sub">${esc(sub)}</p>` : ''}
      <div class="actions"><button class="btn" data-ans="0">${esc(cancel)}</button><button class="btn ${danger ? 'danger-fill' : 'primary'}" data-ans="1">${esc(ok)}</button></div>`);
    modalResolve = v => res(v === '1');
  });
}
// 2択（どちらでもない＝閉じた場合は null）
function askChoice(msg, a, b) {
  return new Promise(res => {
    sheet(`<p class="ask-msg">${esc(msg)}</p>
      <div class="actions col"><button class="btn primary" data-ans="a">${esc(a)}</button><button class="btn outline" data-ans="b">${esc(b)}</button><button class="btn" data-ans="">やめる</button></div>`);
    modalResolve = v => res(v || null);
  });
}
async function saveComplete() {
  const p = findP(view.id);
  const f = readForm();
  f.photo = await commitPhoto(undefined);
  state.records.push({ id: uid(), patternId: p.id, patternName: p.name, ...f, createdAt: Date.now() });
  stopTimer(p);
  if (document.getElementById('mReset').checked) { p.steps.forEach(s => { s.done = false; delete s.pause; if (s.count) s.n = 0; }); clearRun(p); }
  save(); closeModal(); update(); toast('記録しました');
}

/* ===== 編集の操作 ===== */
// 編集画面で工程を足す。段数が書いていなければ、続きの段数を自動で付ける
// （1つずつ追加するときは、段数の欄の値を使う。空にすれば段数なし）
function addSteps(lines, keepFocus, rowVal) {
  const add = lines.map(s => s.trim()).filter(Boolean);
  if (!add.length) return;
  add.forEach(t => {
    const ps = parseStep(t);
    if (!ps.row) ps.row = rowVal !== undefined ? normRow(rowVal) : nextRow(draft.steps);
    applyRows(ps, nextRow(draft.steps));
    autoRange(ps);
    draft.steps.push({ id: uid(), ...ps, done: false });
  });
  render();
  if (keepFocus) document.getElementById('newStep')?.focus();
}
function swap(i, j) {
  const s = draft.steps;
  if (j < 0 || j >= s.length) return;
  [s[i], s[j]] = [s[j], s[i]]; render();
}
function saveDraft() {
  const name = draft.name.trim();
  if (!name) { toast('作品名を入力してください'); return; }
  const pending = document.getElementById('newStep')?.value.trim();   // 「追加」を押し忘れた入力も拾う
  if (pending) { const ps = parseStep(pending); if (!ps.row) ps.row = normRow(document.getElementById('newRow')?.value); draft.steps.push(autoRange({ id: uid(), ...ps, done: false })); }
  const steps = draft.steps.map(s => { const c = splitCount(s.text); const o = { ...s, row: normRow(s.row), text: c.text }; if (c.rows) { o.rowsN = c.rows; applyRows(o); } if (c.count) { o.count = c.count; o.n = Math.min(o.n || 0, c.count); delete o.byRow; } return autoRange(o); }).filter(s => s.text);
  const data = { ...(findP(draft.id) || {}), id: draft.id, name, video: (draft.video || '').trim(), memo: draft.memo.trim(), steps, createdAt: draft.createdAt || Date.now(), updatedAt: Date.now() };
  const i = state.patterns.findIndex(p => p.id === data.id);
  if (i >= 0) state.patterns[i] = data; else state.patterns.unshift(data);
  save(); draft = null; go('pattern', data.id); toast('保存しました');
}

/* ===== イベント ===== */
document.addEventListener('click', e => {
  if (Date.now() < suppressClick) { suppressClick = 0; if (!e.target.closest('#modal .sheet')) return; }
  if (e.target === modal) { closeModal(); return; }
  const ans = e.target.closest('[data-ans]');
  if (ans) {
    formVals = {}; modal.querySelectorAll('input,textarea').forEach(i => { if (i.id) formVals[i.id] = i.value; });
    answer(ans.dataset.ans); return;
  }
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const a = el.dataset.action, idx = +el.dataset.idx, id = el.dataset.id;
  const p = findP(view.id);

  switch (a) {
    case 'home': go('home'); break;
    case 'tab': go(el.dataset.tab); break;
    case 'open': videoOpen = true; go('pattern', id); break;
    case 'new': draft = { id: uid(), name: '', video: '', memo: '', steps: [], isNew: true }; go('edit'); break;
    case 'edit': draft = { ...structuredClone(p), isNew: false }; go('edit', p.id); break;

    case 'cntdown': {
      const st = p.steps[idx];
      st.n = Math.max(0, (st.n || 0) - 1); st.done = false;
      p.updatedAt = Date.now(); save(); update(); break;
    }
    case 'cntset': {   // 四角をタップ：そこまで埋める（最後の埋まった四角なら1つ戻す）
      const st = p.steps[idx], k = +el.dataset.k;
      st.n = (st.n || 0) === k + 1 ? k : k + 1;
      st.done = st.n >= st.count;
      if (st.done) delete st.pause;
      if (st.n) markDay(p);
      p.updatedAt = Date.now(); save(); update();
      if (p.steps.every(s => s.done)) toast('全工程チェック完了！');
      break;
    }
    case 'toggle':
      if (p.steps[idx].count > 1 && !p.steps[idx].done) {   // 回数のある工程：1回ずつ
        const st = p.steps[idx];
        st.n = Math.min(st.count, (st.n || 0) + 1); markDay(p);
        if (st.n >= st.count) { st.done = true; delete st.pause; }
        p.updatedAt = Date.now(); save(); update();
        if (p.steps.every(s => s.done)) toast('全工程チェック完了！');
        break;
      }
      if (p.steps[idx].count > 1) p.steps[idx].n = 0;   // 完了している回数付きの工程をタップ → 0からやり直し
      p.steps[idx].done = !p.steps[idx].done;
      if (p.steps[idx].done) delete p.steps[idx].pause;
      if (p.steps[idx].done) markDay(p);   // チェックした日を「編んだ日」に（最初の日が「始めた日」）
      else if (!p.steps.some(s => s.done || s.n) && !elapsed(p)) { delete p.startedAt; delete p.workDays; }   // 全部外して時間も0なら「まだ始めていない」に戻す
      p.updatedAt = Date.now(); save(); update();
      if (p.steps.every(s => s.done)) toast('全工程チェック完了！');
      break;
    case 'reset':
      askConfirm('チェックをすべて外しますか？', { ok: '外す', sub: p.startedAt || p.timer ? 'タイマーと編んだ日もリセットされます（今回の材料はそのまま残ります）' : '' }).then(ok => { if (ok) { p.steps.forEach(s => { s.done = false; delete s.pause; if (s.count) s.n = 0; }); clearProgress(p); save(); update(); } });
      break;
    case 'complete': openComplete(p); break;
    case 'modal-close': closeModal(); break;
    case 'modal-save': saveComplete(); break;
    case 'viewrec': openRecord(id); break;
    case 'saverec': saveRecord(id); break;
    case 'photodel': pendingPhoto = null; refreshPhotoBox(); break;
    case 'delrec':
      askConfirm('この記録を削除しますか？', { ok: '削除', danger: true }).then(ok => { if (ok) { delPhoto(state.records.find(r => r.id === id)?.photo); state.records = state.records.filter(r => r.id !== id); save(); update(); toast('削除しました'); } else openRecord(id); });
      break;

    case 'pause': setPause(p, idx); break;
    case 'timer':
      if (p.timer?.running) { stopTimer(p); toast('休憩中。おつかれさまです'); }
      else {
        startTimer(p);
        // 初めてのときだけ通知の許可を聞く
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().then(r => { if (r === 'granted') syncTimerNote(); }).catch(() => {});
      }
      p.updatedAt = Date.now(); save(); update(); break;
    case 'timeredit': editTimer(p); break;
    case 'startedit': editStart(p); break;
    case 'mat': editMat(p); break;
    case 'fillprev': {
      const r = prevCombos(p)[idx];
      if (r) modal.querySelector('.matf').outerHTML = matFields('r', r);
      break;
    }
    case 'swatch': applyColor(el.closest('.swatches').dataset.px, el.dataset.hex || '', el.dataset.name); break;
    case 'chipsel': { const px = el.dataset.px, c = document.getElementById(px + 'Chips'); const again = c.dataset.explicit === '1' && +c.dataset.sel === idx; setYs(px, getYs(px), again ? firstSel(getYs(px)) : idx, !again); break; }
    case 'chipdel': { const px = el.dataset.px, ys = getYs(px); ys.splice(idx, 1); setYs(px, ys, firstSel(ys)); break; }
    case 'matedit': expandMat(); break;
    case 'quickadd': quickAdd(); break;
    case 'video': videoOpen = !videoOpen; render(); break;
    case 'addstep': addSteps([document.getElementById('newStep').value], true, document.getElementById('newRow').value); break;
    case 'bulkadd': addSteps(document.getElementById('bulk').value.split('\n'), false); break;
    case 'up': swap(idx, idx - 1); break;
    case 'down': swap(idx, idx + 1); break;
    case 'delstep': draft.steps.splice(idx, 1); render(); break;
    case 'save': saveDraft(); break;
    case 'cancel': {
      const back = draft.isNew ? ['home', null] : ['pattern', draft.id];
      draft = null; go(...back); break;
    }
    case 'dupe': {
      const src = findP(draft.id);
      if (!src) break;
      askConfirm(`「${src.name}」を複製しますか？`, { ok: '複製する', sub: '編集中でまだ保存していない変更は、複製に入りません' }).then(ok => {
        if (!ok) return;
        const copy = {
          id: uid(), name: src.name + '（コピー）', video: src.video || '', memo: src.memo || '',
          steps: src.steps.map(st => { const c = { ...st, id: uid(), done: false }; delete c.pause; if (c.count) c.n = 0; return c; }),
          createdAt: Date.now(), updatedAt: Date.now(),
        };
        const i = state.patterns.findIndex(x => x.id === src.id);
        state.patterns.splice(i + 1, 0, copy); save();
        draft = { ...structuredClone(copy), isNew: false }; go('edit', copy.id);   // すぐ名前を直せるように編集画面へ
        toast('複製しました。名前を変えて保存してください');
      });
      break;
    }
    case 'delpattern':
      { const w = findP(id); if (!w) break;
        askConfirm(`「${w.name}」を削除しますか？`, { ok: '削除', danger: true, sub: '完成記録は残ります' }).then(ok => {
          if (ok) { state.patterns = state.patterns.filter(x => x.id !== w.id); save(); render(); toast('削除しました'); }
        }); }
      break;

    case 'connect': {
      const t = document.getElementById('token').value.trim();
      if (!t) { toast('トークンを入力してください'); return; }
      connect(t); break;
    }
    case 'syncnow': if (dirty) flush(); else { sync.gistId = null; pull(); } break;   // 保存先も探し直す
    case 'disconnect':
      askConfirm('クラウド保存をやめますか？', { ok: 'やめる', cancel: '続ける', danger: true, sub: 'クラウドのデータは消えません。トークンを入れ直せば再開できます' }).then(ok => { if (ok) disconnect(); });
      break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'quickRow' || e.target.id === 'sRow' || e.target.id === 'newRow') {
    const d = document.getElementById({ quickRow: 'quickDan', sRow: 'sDan', newRow: 'newDan' }[e.target.id]);
    if (d) d.textContent = danLabel(e.target.value);
  }
  if (e.target.dataset?.field === 'row') { const d = e.target.nextElementSibling; if (d?.classList.contains('dan')) d.textContent = danLabel(e.target.value); }
  if (e.target.type === 'color' && e.target.id.endsWith('Pick')) applyColor(e.target.id.slice(0, -4), e.target.value);
  if (e.target.classList.contains('yarn-in') && !e.isComposing && /[ 　]/.test(e.target.value)) {
    const parts = e.target.value.split(/[ 　]+/), rest = parts.pop();
    parts.filter(Boolean).forEach(t => addYarn(e.target.dataset.px, t));
    e.target.value = rest;
  }
  if (e.target.id === 'mStart' || e.target.id === 'mDate') {
    const d = daysBetween(document.getElementById('mStart').value, document.getElementById('mDate').value);
    document.getElementById('mDays').textContent = d ? `期間：${d}日` : '';
  }
  const f = e.target.dataset.field;
  if (!f || !draft) return;
  if (f === 'step') draft.steps[+e.target.dataset.idx].text = e.target.value;
  else if (f === 'row') draft.steps[+e.target.dataset.idx].row = e.target.value;
  else draft[f] = e.target.value;
  if (e.target.tagName === 'TEXTAREA') autoGrow(e.target);
});

document.addEventListener('keydown', e => {
  // 日本語入力の変換確定Enterでは追加しない
    if (e.target.classList?.contains('yarn-in') && e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); flushYarnIn(e.target.dataset.px); return; }
  if (e.target.id === 'quickRow' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); document.getElementById('quickStep').focus(); return; }
  if (e.target.id === 'quickStep' && e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault(); quickAdd(); return;
  }
  if (e.target.id === 'newStep' && e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault(); addSteps([e.target.value], true, document.getElementById('newRow')?.value);
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'wakeToggle') { try { localStorage.setItem(WAKE_KEY, e.target.checked ? '1' : '0'); } catch (err) {} syncWake(); toast(e.target.checked ? '編んでいる間は画面を消さないようにしました' : '画面はふだんどおり消えます'); }
  if (e.target.classList?.contains('hook-in')) e.target.value = normHook(e.target.value);
  if (e.target.id === 'photoFile' && e.target.files[0]) {
    try { pendingPhoto = await shrink(e.target.files[0]); refreshPhotoBox(); }
    catch (err) { toast('写真を読み込めませんでした'); }
  }
});

// 日本語入力で確定した文字にスペースが入っていたときも糸にする
document.addEventListener('compositionend', e => {
  if (!e.target.classList?.contains('yarn-in') || !/[ 　]/.test(e.target.value)) return;
  const parts = e.target.value.split(/[ 　]+/), rest = parts.pop();
  parts.filter(Boolean).forEach(t => addYarn(e.target.dataset.px, t));
  e.target.value = rest;
});

/* ===== 起動 ===== */
(async () => {
  if (!localStorage.getItem(KEY) && localStorage.getItem(OLD_KEY)) store();   // 旧名から引き継ぎ
  // localStorageが空なら IndexedDB の控えから戻す
  if (!sync.token) { const c = await idbGet('sync'); if (c?.token) { sync = c; saveSync(); syncStatus = 'syncing'; } }
  if (isEmpty(state)) { const d = await idbGet('state'); if (d) { state = normalize(d); store(); } }
  navigator.storage?.persist?.();   // ブラウザに勝手に消されにくくする
  render();
  // 通知から開いたとき
  const q = new URLSearchParams(location.search);
  if (q.get('stop')) remoteStop(q.get('stop'), +q.get('at'));
  if (q.get('open') && findP(q.get('open'))) go('pattern', q.get('open'));
  if (q.toString()) history.replaceState(null, '', location.pathname);
  pull();
  syncTimerNote();
  syncWake();
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
